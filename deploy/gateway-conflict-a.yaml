gateway:
  dns_refresh_interval: 1s
  max_bytes: 512MiB
  max_fanout: 8
  max_requests: 1024
  max_requests_per_store: 128
  routes:
    - store: primary
      target: dns:///engine-primary-a:8080
      tls:
        insecure: true
grpc:
  address: :8080
  max_receive_message_bytes: 64MiB
  max_send_message_bytes: 64MiB
mode: gateway
health:
  address: ":8081"
prometheus:
  enabled: true
  address: :9090
service:
  request:
    max_operations: 1000
    max_read_bytes: 32MiB
    timeout: 30s
shutdown_timeout: 15s
