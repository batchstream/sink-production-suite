grpc:
  address: :8080
  max_receive_message_bytes: 64MiB
  max_send_message_bytes: 32MiB
mode: gateway
health:
  address: :8081
prometheus:
  enabled: true
  address: :9090
shutdown_timeout: 15s
forwarding:
  dns_refresh_interval: 1s
  max_fanout: 8
  routes:
  - store: primary
    target: dns:///engine-primary-b:8080
    tls:
      insecure: true
request:
  max_operations: 1000
