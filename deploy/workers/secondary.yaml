mode: worker
health:
  address: :8081
prometheus:
  enabled: true
  address: :9090
shutdown_timeout: 15s
execution:
  merge:
    lua:
      max_cached_programs: 256
      max_instructions: 1e+06
      max_result_bytes: 16MiB
      max_source_bytes: 64KiB
      timeout: 100ms
    max_attempts: 50
consumer:
  group_id: sink-production-secondary-workers
  max_poll_records: 500
  retry:
    backoff: 100ms
    max_backoff: 10s
