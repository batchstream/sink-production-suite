grpc:
  address: :8080
  max_receive_message_bytes: 64MiB
  max_send_message_bytes: 64MiB
mode: engine
health:
  address: ":8081"
prometheus:
  enabled: true
  address: :9090
service:
  batching:
    max_bytes: 16MiB
    max_operations: 1000
    max_wait: 2ms
    queue:
      max_bytes: 128MiB
      max_operations: 10000
  merge:
    lua:
      max_cached_programs: 256
      max_instructions: 1e+06
      max_result_bytes: 16MiB
      max_source_bytes: 64KiB
      timeout: 100ms
    max_attempts: 50
  request:
    max_operations: 1000
shutdown_timeout: 15s
storage:
  driver: elasticsearch
  kafka:
    brokers:
      - kafka:19092
    consumer:
      max_poll_records: 500
      retry:
        backoff: 100ms
        max_backoff: 10s
    enabled: true
    topic:
      name: sink-production-elasticsearch-mutations
      partitions: 8
      replication_factor: 1
  name: elasticsearch-async
  search:
    endpoints:
      - http://elasticsearch-async:9200
