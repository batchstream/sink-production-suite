mode: worker

prometheus:
  address: ":9090"

storages:
  - name: primary
    driver: opensearch
    search:
      endpoints:
        - http://opensearch:9200
    kafka:
      enabled: true
      brokers:
        - kafka:19092
      topic:
        name: sink-production-mutations
        partitions: 8
        replication_factor: 1
      consumer:
        group_id: sink-production-workers
        max_poll_records: 500
        retry:
          backoff: 100ms
          max_backoff: 10s
      dead_letter:
        topic: sink-production-mutations.dlq
  - name: secondary
    driver: opensearch
    search:
      endpoints:
        - http://opensearch:9200
    kafka:
      enabled: true
      brokers:
        - kafka-secondary:19092
      topic:
        name: sink-production-secondary-mutations
        partitions: 8
        replication_factor: 1
      consumer:
        group_id: sink-production-secondary-workers
        max_poll_records: 500
        retry:
          backoff: 100ms
          max_backoff: 10s
      dead_letter:
        topic: sink-production-secondary-mutations.dlq
  - name: sync-only
    driver: opensearch
    search:
      endpoints:
        - http://opensearch:9200
  - name: elasticsearch-sync
    driver: elasticsearch
    search:
      endpoints:
        - http://elasticsearch:9200
  - name: elasticsearch-async
    driver: elasticsearch
    search:
      endpoints:
        - http://elasticsearch:9200
    kafka:
      enabled: true
      brokers:
        - kafka:19092
      topic:
        name: sink-production-elasticsearch-mutations
        partitions: 8
        replication_factor: 1
      consumer:
        group_id: sink-production-elasticsearch-workers
        max_poll_records: 500
        retry:
          backoff: 100ms
          max_backoff: 10s
      dead_letter:
        topic: sink-production-elasticsearch-mutations.dlq
  - name: mongodb-sync
    driver: mongodb
    mongodb:
      uri: mongodb://mongodb:27017/?replicaSet=rs0
      metadata_field: __sink
      max_concurrent_writes: 64
      max_concurrent_groups: 16
  - name: mongodb-async
    driver: mongodb
    mongodb:
      uri: mongodb://mongodb:27017/?replicaSet=rs0
      metadata_field: __sink
      max_concurrent_writes: 64
      max_concurrent_groups: 16
    kafka:
      enabled: true
      brokers:
        - kafka-secondary:19092
      topic:
        name: sink-production-mongodb-mutations
        partitions: 8
        replication_factor: 1
      consumer:
        group_id: sink-production-mongodb-workers
        max_poll_records: 500
        retry:
          backoff: 100ms
          max_backoff: 10s

      dead_letter:
        topic: sink-production-mongodb-mutations.dlq
service:
  request:
    max_operations: 1000
  merge:
    max_attempts: 50
    lua:
      timeout: 100ms
      max_source_bytes: 65536
      max_result_bytes: 16777216
      max_cached_programs: 256
      max_instructions: 1000000

shutdown_timeout: 15s
